[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verity"
version = "0.1.0"
description = "verity.assemble(model, user_id) — upload a trained model for identification, evaluation, and monitoring"
authors = [{ name = "Koustav Manna" }]
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "cloudpickle>=3.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "scikit-learn>=1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
