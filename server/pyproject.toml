[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "boto3>=1.34.0",
    "supabase>=2.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "openai>=1.0.0",
    "cloudpickle>=3.0.0",
    # Nat scores eval runs server-side, so these are runtime deps, not test-only ones.
    "scikit-learn>=1.0.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    # Tabular ML is V1's whole scope, and a model fit on a DataFrame cannot be
    # unpickled — let alone evaluated — without pandas present.
    "pandas>=2.0.0",
    # Local container runtime for api-fication. Kept behind serving/runtime.py's
    # interface, so a cloud runner later is a new class rather than a dependency swap.
    "docker>=7.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
markers = [
    "docker: needs a running Docker daemon; skipped automatically when unreachable",
]
